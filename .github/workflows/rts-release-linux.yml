name: Linux release (nearai fork)

# Builds and publishes this fork's Linux x86_64 release: the mvmctl archive
# (mvmctl, its host helpers, the locked Firecracker) and the guest runtime,
# both signed with cosign keyless under this workflow's identity, which
# `mvm_core::release_trust` names. Mirrors the Linux legs of release.yml and
# guest-bins.yml without the macOS, packaging and promotion stages, so it
# needs no secrets: GitHub OIDC only.

on:
  push:
    tags:
      - "v*-rts.*"

permissions:
  contents: read

concurrency:
  group: rts-release-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET: x86_64-unknown-linux-gnu
  BUILD_TARGET: x86_64-unknown-linux-musl
  MVMCTL_RELEASE_FEATURES: host,user,release-artifact-bootstrap,release-channel,embed-host-bins

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check the tag is this workspace's version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not v${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu

      - uses: ./.github/actions/install-zigbuild

      - name: Build mvmctl
        env:
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1
        run: cargo zigbuild --profile release-min --target "${BUILD_TARGET}" --features "${MVMCTL_RELEASE_FEATURES}"

      - name: Build per-VM host binaries
        env:
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1
        shell: bash
        run: |
          set -euo pipefail
          cargo zigbuild --release --target "${BUILD_TARGET}" -p mvm-hostd -p mvm-gpu \
            --bin mvm-host-agent \
            --bin mvm-policy-coordinator \
            --bin mvm-signer-helper \
            --bin mvm-network-endpoint \
            --bin mvm-broker \
            --bin mvm-audit-signer \
            --bin mvm-mailbox \
            --bin mvm-actor-holder \
            --bin mvm-actor-controller \
            --bin mvm-gpu-endpoint
          cargo zigbuild --release --target "${TARGET}" -p mvm-hostlib --features mvm-client/release-channel
          mkdir -p "target/${BUILD_TARGET}/release"
          cp "target/${TARGET}/release/libmvm_hostlib.so" "target/${BUILD_TARGET}/release/libmvm_hostlib.so"

      - name: Verify the release payloads are statically linked
        shell: bash
        run: |
          set -euo pipefail
          for binary in \
            "target/${BUILD_TARGET}/release-min/mvmctl" \
            "target/${BUILD_TARGET}/release/mvm-host-agent" \
            "target/${BUILD_TARGET}/release/mvm-policy-coordinator" \
            "target/${BUILD_TARGET}/release/mvm-signer-helper" \
            "target/${BUILD_TARGET}/release/mvm-network-endpoint" \
            "target/${BUILD_TARGET}/release/mvm-broker" \
            "target/${BUILD_TARGET}/release/mvm-audit-signer"; do
            description="$(file --brief "${binary}")"
            echo "${binary}: ${description}"
            [[ "${description}" == *"statically linked"* ]] || { echo "::error::${binary} is not statically linked" >&2; exit 1; }
          done

      - name: Smoke test mvmctl
        run: |
          "target/${BUILD_TARGET}/release-min/mvmctl" --version
          "target/${BUILD_TARGET}/release-min/mvmctl" --version | grep -qx "mvmctl ${VERSION}"

      - name: Build the guest runtime
        run: cargo run --locked -p mvmctl -- dev guest-bins --out dist

      - name: Stage and package the mvmctl archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_NAME="mvmctl-${TARGET}"
          mkdir -p "staging/${ARCHIVE_NAME}"
          cp "target/${BUILD_TARGET}/release-min/mvmctl" "staging/${ARCHIVE_NAME}/"
          for hostbin in mvm-host-agent mvm-policy-coordinator mvm-signer-helper mvm-network-endpoint \
            mvm-broker mvm-audit-signer mvm-mailbox mvm-actor-holder mvm-actor-controller mvm-gpu-endpoint; do
            cp "target/${BUILD_TARGET}/release/${hostbin}" "staging/${ARCHIVE_NAME}/"
          done
          scripts/release/stage-firecracker.sh x86_64 "staging/${ARCHIVE_NAME}/firecracker"
          cp "target/${BUILD_TARGET}/release/libmvm_hostlib.so" "staging/${ARCHIVE_NAME}/"
          cp -r assets "staging/${ARCHIVE_NAME}/" 2>/dev/null || true
          cp README.md LICENSE "staging/${ARCHIVE_NAME}/"
          cp crates/deps/mvm-macho-sign/LICENSE "staging/${ARCHIVE_NAME}/LICENSE-MPL-2.0.txt"
          printf '%s\n' \
            'This release contains mvm-macho-sign, modified MPL-2.0 Covered Software adapted from apple-codesign 0.29.0, Copyright Gregory Szorc.' \
            'LICENSE-MPL-2.0.txt governs those files, not Apache-2.0 alone.' \
            'Corresponding source, including modifications, is available under MPL-2.0 at:' \
            "https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}/crates/deps/mvm-macho-sign" \
            > "staging/${ARCHIVE_NAME}/THIRD_PARTY_NOTICES.txt"
          cargo run --package xtask --features man -- emit-backend-components-tsv > "staging/${ARCHIVE_NAME}/components.tsv"
          test -s "staging/${ARCHIVE_NAME}/components.tsv"
          mkdir -p artifacts
          tar -C staging -czf "artifacts/${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          (cd artifacts && sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256")

      - name: Collect the guest runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="mvm-guest-bins-v${VERSION}.tar.gz"
          test -f "dist/${runtime}" && test -f "dist/${runtime}.sha256"
          (cd dist && sha256sum --check "${runtime}.sha256")
          cp "dist/${runtime}" "dist/${runtime}.sha256" artifacts/
          (cd artifacts && cat ./*.sha256 > checksums-sha256.txt && cat checksums-sha256.txt)

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.5.2

      - name: Sign every published file (cosign keyless)
        shell: bash
        run: |
          set -euo pipefail
          for blob in artifacts/*.tar.gz artifacts/*.sha256 artifacts/checksums-sha256.txt; do
            cosign sign-blob --yes --new-bundle-format --bundle "${blob}.bundle" "${blob}"
          done
          ls -l artifacts

      - name: Verify the signatures under this workflow's identity
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/rts-release-linux.yml@refs/tags/${GITHUB_REF_NAME}"
          for blob in artifacts/*.tar.gz artifacts/*.sha256 artifacts/checksums-sha256.txt; do
            cosign verify-blob --bundle "${blob}.bundle" \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "${blob}"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --prerelease \
            --title "${GITHUB_REF_NAME} (nearai Linux build)" \
            --notes "Linux x86_64 build of ${GITHUB_SHA}: upstream tinylabscom/mvm main plus the OCI redirect and mkfs.ext4 fixes. Signed with cosign keyless by .github/workflows/rts-release-linux.yml; see checksums-sha256.txt."
